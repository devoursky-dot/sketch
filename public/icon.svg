<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Film Strip / Rotoscoping Frame Track (Background Accent) -->
  <g opacity="0.35">
    <rect x="76" y="96" width="360" height="320" rx="24" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 12"/>
    <circle cx="106" cy="126" r="8" fill="#38bdf8"/>
    <circle cx="406" cy="126" r="8" fill="#38bdf8"/>
    <circle cx="106" cy="386" r="8" fill="#38bdf8"/>
    <circle cx="406" cy="386" r="8" fill="#38bdf8"/>
  </g>

  <!-- Stylized Dynamic Rotoscoping Curves -->
  <path d="M120 320 C 180 200, 260 380, 390 190" fill="none" stroke="url(#neonPurple)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 320 C 180 200, 260 380, 390 190" fill="none" stroke="url(#neonPurple)" stroke-width="28" stroke-linecap="round" opacity="0.25" filter="url(#glow)"/>

  <!-- Stylus / Inking Pen -->
  <g transform="translate(140, 60) rotate(35, 128, 128)">
    <!-- Pen Barrel -->
    <path d="M110 50 L146 50 L140 220 L116 220 Z" fill="url(#neonCyan)"/>
    <!-- Grip & Accent Rings -->
    <rect x="110" y="140" width="36" height="45" rx="4" fill="#0284c7"/>
    <line x1="110" y1="155" x2="146" y2="155" stroke="#38bdf8" stroke-width="3"/>
    <line x1="110" y1="170" x2="146" y2="170" stroke="#38bdf8" stroke-width="3"/>
    <!-- Pen Nib (Inking Tip) -->
    <path d="M116 220 L140 220 L128 262 Z" fill="url(#neonOrange)"/>
    <circle cx="128" cy="265" r="5" fill="#fef08a" filter="url(#glow)"/>
  </g>
</svg>
